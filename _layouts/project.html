{% for project in site.projects %}
<div class="project-card">

  <div class="article-meta">
    <span class="platform">PROJECT</span>
  </div>

  <h2>{{ project.title }}</h2>

  <p>{{ project.description }}</p>

  <div class="tags">
    {% for tech in project.tech %}
      <span>{{ tech }}</span>
    {% endfor %}
  </div>

  {% if project.github %}
    <a
      class="button primary"
      href="{{ project.github }}"
      target="_blank"
      rel="noopener noreferrer">
      View on GitHub ↗
    </a>
  {% endif %}

</div>
{% endfor %}
