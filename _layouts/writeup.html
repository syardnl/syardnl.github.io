---
layout: default
---

<div class="writeup">
  <article class="article">

    <div class="article-header">
      <div class="article-meta">
        <span class="platform">{{ page.platform }}</span>
        <span class="difficulty {{ page.difficulty | downcase }}">
          {{ page.difficulty }}
        </span>
        <span>{{ page.date | date: "%d %b %Y" }}</span>
      </div>

      <h1>{{ page.title }}</h1>

      <p>{{ page.description }}</p>

      <div class="tags">
        {% for tag in page.tags %}
          <span>{{ tag }}</span>
        {% endfor %}
      </div>
    </div>

    <div class="article-layout">
      <div class="prose">
        {{ content }}
      </div>

      <aside class="toc">
        <strong>ON THIS PAGE</strong>
        <div id="toc"></div>
      </aside>
    </div>

  </article>
</div>
